<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Notitia · Le foyer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;650&family=Literata:opsz,wght@7..72,500;7..72,650&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#efe6d6;
  --page:#f6efe3;
  --sheet:#fbf6ec;
  --ink:#241c16;
  --mute:#6a5d50;
  --faint:#8a7c6d;
  --rule:#d9cbb8;
  --brick:#8f4030;
  --moss:#3d5a43;
  --pin:#b5834a;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--paper);color:var(--ink)}
body{
  font:16px/1.5 Figtree,ui-sans-serif,system-ui,sans-serif;
  background-image:
    radial-gradient(ellipse 80% 50% at 50% -10%, #f7edd8, transparent 55%),
    linear-gradient(180deg, #eadfcb 0, var(--paper) 180px);
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.app{max-width:1180px;margin:0 auto;padding:28px 22px 72px}
.mast{
  display:grid;
  grid-template-columns:1fr auto;
  gap:18px;
  align-items:end;
  padding-bottom:22px;
  border-bottom:1px solid var(--ink);
}
.kicker{font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:var(--brick);font-weight:650}
.names{font:650 clamp(34px,6vw,56px)/.95 Literata,Georgia,serif;margin:6px 0 0;letter-spacing:-.03em}
.month-nav{display:flex;align-items:center;gap:10px}
.ghost{
  min-width:40px;height:40px;border:1px solid var(--ink);background:transparent;
  display:grid;place-items:center;
}
.month-label{font:650 18px Literata,Georgia,serif;min-width:10rem;text-align:center}
.desk{display:grid;grid-template-columns:1.05fr .95fr;gap:28px;margin-top:28px}
.sheet{
  background:var(--sheet);
  border:1px solid #e2d4bf;
  box-shadow:0 1px 0 #fff8, 0 18px 40px #2a1c0c12;
  padding:26px 26px 22px;
}
.sheet h2{font:650 15px Literata,Georgia,serif;margin:0 0 4px;letter-spacing:.02em}
.quiet{color:var(--mute);margin:0 0 18px;font-size:14px}
.sum{
  font:650 clamp(40px,6vw,64px)/.9 Literata,Georgia,serif;
  letter-spacing:-.04em;
}
.sum small{display:block;margin-top:8px;font:500 13px Figtree,sans-serif;color:var(--mute);letter-spacing:0}
.beam{margin:22px 0 8px;position:relative;height:44px}
.beam-line{position:absolute;left:0;right:0;top:21px;height:1px;background:var(--ink)}
.beam-end{position:absolute;top:0;display:flex;flex-direction:column;gap:2px;font-size:12px}
.beam-end b{font:650 15px Literata,Georgia,serif}
.beam-end.q{left:0}
.beam-end.j{right:0;text-align:right}
.pin{
  position:absolute;top:13px;width:17px;height:17px;border-radius:50%;
  background:var(--pin);border:2px solid var(--ink);transform:translateX(-50%);
}
.note{
  margin-top:14px;padding-top:12px;border-top:1px dashed var(--rule);
  color:var(--mute);font-size:14px;
}
.env-head{display:flex;justify-content:space-between;align-items:baseline;margin:28px 0 10px}
.env-head h2{margin:0}
.env-grid{display:grid;gap:8px}
.env{
  display:grid;grid-template-columns:7.2rem 1fr auto;gap:10px;align-items:center;
  padding:9px 0;border-bottom:1px solid var(--rule);
}
.env .cat{font-weight:650}
.env .track{height:3px;background:#e7dcc9;position:relative}
.env .fill{position:absolute;inset:0 auto 0 0;background:var(--ink)}
.env .fill.over{background:var(--brick)}
.env .fill.ok{background:var(--moss)}
.env .meta{font-size:12px;color:var(--mute);text-align:right;min-width:7.5rem}
.env input{
  width:5.4rem;border:0;border-bottom:1px solid var(--ink);background:transparent;
  text-align:right;padding:2px 0;font-weight:650;
}
.env input:focus{outline:none;border-bottom-width:2px}
.ledger{margin-top:28px}
.line{
  display:grid;grid-template-columns:5.6rem 1fr auto;gap:12px;
  padding:9px 0 9px 12px;border-bottom:1px solid var(--rule);
  position:relative;
}
.line:before{
  content:"";position:absolute;left:0;top:6px;bottom:6px;width:2px;background:#c24a3a99;
}
.line .when{color:var(--faint);font-size:13px}
.line .who{color:var(--mute);font-size:13px}
.line .amt{font-weight:650;font-variant-numeric:tabular-nums}
.empty{color:var(--faint);padding:16px 0;font-size:14px}
.talk{
  background:var(--page);
  border:1px solid #d8c9b2;
  min-height:720px;
  display:flex;flex-direction:column;
  box-shadow:8px 12px 0 #2a1c0c0a;
}
.talk-head{padding:22px 22px 0}
.talk-head h2{font:650 28px/1 Literata,Georgia,serif;margin:0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0 0}
.chip{
  border:1px solid var(--ink);background:transparent;padding:7px 10px;font-size:13px;min-height:36px;
}
.chip:hover{background:var(--ink);color:var(--sheet)}
.thread{flex:1;overflow:auto;padding:18px 22px;display:flex;flex-direction:column;gap:14px}
.msg{max-width:92%}
.msg.user{align-self:flex-end}
.msg .paper{
  background:#fffaf1;border:1px solid #e4d6c1;padding:11px 13px;white-space:pre-wrap;
}
.msg.user .paper{background:#241c16;color:#f6efe3;border-color:#241c16}
.msg img{display:block;max-width:200px;margin-bottom:6px;border:1px solid #e4d6c1}
.card{
  margin:0 22px 12px;padding:12px 14px;border:1px solid var(--ink);background:#fffaf1;
}
.card p{margin:6px 0 10px}
.do{
  border:0;background:var(--ink);color:var(--sheet);padding:10px 12px;font-weight:650;
}
.composer{margin:0 14px 14px;border-top:1px solid var(--ink);padding-top:12px}
.attach{display:flex;gap:8px;align-items:center;margin-bottom:8px;font-size:13px}
.attach img{width:36px;height:36px;object-fit:cover;border:1px solid var(--rule)}
.attach button{border:0;background:transparent;color:var(--mute)}
.row{display:flex;align-items:flex-end;gap:8px}
.icon,.send{
  width:42px;height:42px;flex:none;border:1px solid var(--ink);background:var(--sheet);
  display:grid;place-items:center;
}
.send{background:var(--brick);border-color:var(--brick);color:#fffaf1}
textarea{
  flex:1;border:0;background:transparent;resize:none;min-height:42px;max-height:120px;
  padding:10px 4px;outline:none;
}
.file{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.manual{margin-top:18px;padding-top:16px;border-top:1px solid var(--rule)}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.wide{grid-column:1/-1}
label{display:block;font-size:12px;color:var(--mute);margin-bottom:4px}
.form input,.form select{
  width:100%;border:0;border-bottom:1px solid var(--ink);background:transparent;padding:8px 0;
}
.err{color:var(--brick);font-size:13px}
.tabs{display:none}
@media(max-width:880px){
  .desk{grid-template-columns:1fr}
  .talk{min-height:68vh}
  .tabs{display:flex;gap:8px;margin:18px 0 0}
  .tabs button{flex:1;min-height:42px;border:1px solid var(--ink);background:transparent;font-weight:650}
  .tabs button.on{background:var(--ink);color:var(--sheet)}
  .pane{display:none}
  .pane.on{display:flex}
  .books.on{display:block}
  .form{grid-template-columns:1fr}
  .mast{grid-template-columns:1fr}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main class="app">
  <header class="mast">
    <div>
      <div class="kicker">Notitia · foyer</div>
      <h1 class="names">Quentin & Jessica</h1>
    </div>
    <div class="month-nav">
      <button class="ghost" id="prevM" aria-label="Mois précédent">‹</button>
      <div class="month-label" id="monthLabel">—</div>
      <button class="ghost" id="nextM" aria-label="Mois suivant">›</button>
    </div>
  </header>

  <nav class="tabs" aria-label="Navigation">
    <button type="button" data-tab="talk" class="on">Parler</button>
    <button type="button" data-tab="books">Le mois</button>
  </nav>

  <section class="desk">
    <section class="sheet books pane" id="books">
      <h2>Ce mois</h2>
      <p class="quiet" id="period">Chargement…</p>
      <div class="sum" id="total">0 €</div>
      <div class="beam" aria-hidden="true">
        <div class="beam-line"></div>
        <div class="beam-end q"><b id="qtotal">0 €</b><span>Quentin</span></div>
        <div class="beam-end j"><b id="jtotal">0 €</b><span>Jessica</span></div>
        <div class="pin" id="pin"></div>
      </div>
      <p class="note" id="insight">Le foyer s’écrit au fil des tickets.</p>

      <div class="env-head">
        <h2>Enveloppes</h2>
        <span class="quiet" id="budgetHint">Un montant, puis Entrée</span>
      </div>
      <div class="env-grid" id="envelopes"></div>

      <div class="ledger">
        <h2>Carnet</h2>
        <div id="list"></div>
      </div>

      <details class="manual">
        <summary>Écrire une ligne à la main</summary>
        <form id="form" class="form" style="margin-top:14px">
          <div class="wide"><label for="label">Dépense</label><input id="label" required></div>
          <div><label for="amount">Montant</label><input id="amount" type="number" min="0" step="0.01" required></div>
          <div><label for="date">Date</label><input id="date" type="date" required></div>
          <div><label for="category">Catégorie</label>
            <select id="category"><option>Courses</option><option>Logement</option><option>Transport</option><option>Sorties</option><option>Abonnements</option><option>Santé</option><option>Autres</option></select>
          </div>
          <div><label for="payer">Payé par</label><select id="payer"><option>Quentin</option><option>Jessica</option></select></div>
          <div class="wide"><label for="note">Note</label><input id="note"></div>
          <div class="wide"><button class="do" id="submit" type="submit">Ajouter</button></div>
          <div id="error" class="err wide" hidden></div>
        </form>
      </details>
    </section>

    <section class="talk pane on" id="talk">
      <div class="talk-head">
        <h2>À table</h2>
        <p class="quiet">Une question, un ticket, une capture. Rien n’est écrit sans vous.</p>
        <div class="chips">
          <button class="chip" data-q="Où en est le mois ?">Le mois</button>
          <button class="chip" data-q="Qui doit équilibrer ?">Équilibre</button>
          <button class="chip" data-q="Comment tiennent les enveloppes ?">Budgets</button>
          <button class="chip" data-q="Propose un budget courses raisonnable pour ce mois.">Ajuster courses</button>
        </div>
      </div>
      <div class="thread" id="chat"></div>
      <div id="suggestBox" hidden></div>
      <form class="composer" id="composer">
        <div class="attach" id="attachRow" hidden></div>
        <div class="row">
          <button type="button" class="icon" id="pickBtn" aria-label="Joindre une image">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="5" width="18" height="14" rx="1"/><circle cx="8" cy="10" r="1.4"/><path d="m21 16-5-5-4 4-2-2-5 5"/></svg>
          </button>
          <button type="button" class="icon" id="camBtn" aria-label="Prendre une photo">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3"/></svg>
          </button>
          <textarea id="question" rows="1" placeholder="Écrire, coller une capture, ou joindre un ticket"></textarea>
          <button class="send" id="askBtn" aria-label="Envoyer">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 12h12M13 6l6 6-6 6"/></svg>
          </button>
        </div>
        <input class="file" id="receipt" type="file" accept="image/*">
        <input class="file" id="camera" type="file" accept="image/*" capture="environment">
      </form>
    </section>
  </section>
</main>
<script>
const API_BASE = window.NOTITIA_API || '';
const $ = id => document.getElementById(id);
const CATS = ['Courses','Logement','Transport','Sorties','Abonnements','Santé','Autres'];
let expenses = [], envelopes = [], month = new Date().toISOString().slice(0,7), pendingImage = null;
const eur = n => new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR'}).format(n||0);
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const monthName = m => new Date(m+'-01T00:00:00').toLocaleDateString('fr-FR',{month:'long',year:'numeric'});
function shiftMonth(delta){
  const [y,mo]=month.split('-').map(Number);
  const d=new Date(y, mo-1+delta, 1);
  month=d.toISOString().slice(0,7);
}

function render(){
  $('monthLabel').textContent=monthName(month);
  const rows=expenses.filter(x=>String(x.date||'').startsWith(month) && x.shared!==false);
  const total=rows.reduce((a,x)=>a+Number(x.amount||0),0);
  const q=rows.filter(x=>x.payer==='Quentin').reduce((a,x)=>a+Number(x.amount||0),0);
  const j=rows.filter(x=>x.payer==='Jessica').reduce((a,x)=>a+Number(x.amount||0),0);
  $('total').innerHTML=eur(total)+'<small>'+rows.length+' dépense'+(rows.length>1?'s':'')+' commune'+(rows.length>1?'s':'')+'</small>';
  $('qtotal').textContent=eur(q); $('jtotal').textContent=eur(j);
  const pin=total? (q/total)*100 : 50;
  $('pin').style.left=Math.max(8,Math.min(92,pin))+'%';
  const due=Math.abs(q-j)/2;
  if(!rows.length) $('insight').textContent='Rien n’est encore posé sur ce mois.';
  else if(due<0.01) $('insight').textContent='Quentin et Jessica sont à l’équilibre.';
  else $('insight').textContent=(q>j?'Jessica':'Quentin')+' peut prendre '+eur(due)+' pour lisser.';
  $('period').textContent='Parts égales · '+monthName(month);
  $('envelopes').innerHTML=envelopes.map(e=>{
    const ratio=e.budget>0?Math.min(e.spent/e.budget,1):0;
    const cls=e.status==='over'?'over':(e.status==='ok'?'ok':'');
    const meta=e.budget>0?(eur(e.spent)+' / '+eur(e.budget)):(eur(e.spent)+' · libre');
    return `<div class="env"><div class="cat">${esc(e.category)}</div><div class="track"><i class="fill ${cls}" style="width:${ratio*100}%"></i></div><div class="meta"><input data-cat="${esc(e.category)}" type="number" min="0" step="1" value="${e.budget||''}" placeholder="—"><div>${esc(meta)}</div></div></div>`;
  }).join('');
  document.querySelectorAll('#envelopes input').forEach(inp=>{
    inp.addEventListener('change',()=>saveBudget(inp.dataset.cat, inp.value));
    inp.addEventListener('keydown',ev=>{if(ev.key==='Enter'){ev.preventDefault();inp.blur()}});
  });
  $('list').innerHTML=rows.length?rows.slice().sort((a,b)=>String(b.date).localeCompare(String(a.date))).map(x=>`<div class="line"><div class="when">${esc(String(x.date).slice(8,10)+'/'+String(x.date).slice(5,7))}</div><div><b>${esc(x.label)}</b><div class="who">${esc(x.payer)} · ${esc(x.category)}</div></div><div class="amt">${eur(x.amount)}</div></div>`).join(''):'<div class="empty">Le carnet est encore blanc.</div>';
}

async function saveBudget(category, amount){
  if(amount===''||amount==null) return;
  const r=await fetch(API_BASE+'/api/budgets',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({category,amount,month})});
  const j=await r.json();
  if(!r.ok){ addMsg('bot','Budget non enregistré.'); return }
  envelopes=j.envelopes||envelopes; render();
}

function addMsg(role,text,img){
  const wrap=document.createElement('div'); wrap.className='msg '+role;
  if(img){const im=document.createElement('img'); im.alt='Justificatif'; im.src=img; wrap.appendChild(im)}
  const p=document.createElement('div'); p.className='paper'; p.textContent=text; wrap.appendChild(p);
  $('chat').appendChild(wrap); $('chat').scrollTop=$('chat').scrollHeight; return p;
}
function card(html){
  $('suggestBox').hidden=false; $('suggestBox').innerHTML=html; $('suggestBox').className='card';
}
function hideCards(){ $('suggestBox').hidden=true; $('suggestBox').innerHTML='' }
function showSuggestion(s,b){
  if(!s && !b){ hideCards(); return }
  let html='';
  if(s) html+=`<strong>Ticket lu</strong><p>${esc(s.label)} · ${eur(s.amount)} · ${esc(s.category)} · ${esc(s.date||'date à préciser')} · ${esc(s.payer)}</p><button type="button" class="do" id="confirmSug">Poser dans le carnet</button>`;
  if(b) html+=`<strong style="display:block;margin-top:${s?'14px':'0'}">Enveloppe proposée</strong><p>${esc(b.category)} · ${eur(b.amount)} · ${esc(b.month)}${b.reason?' · '+esc(b.reason):''}</p><button type="button" class="do" id="confirmBud">Tenir ce budget</button>`;
  card(html);
  const cs=$('confirmSug'); if(cs) cs.onclick=async()=>{
    if(!s.date) s.date=new Date().toISOString().slice(0,10);
    try{
      const r=await fetch(API_BASE+'/api/expenses',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(s)});
      const j=await r.json(); if(!r.ok) throw Error(j.detail||j.error||'Erreur');
      expenses.unshift(j.expense); hideCards(); await reload(false); addMsg('bot','C’est dans le carnet.');
    }catch(e){addMsg('bot','Pas pu l’écrire : '+e.message)}
  };
  const cb=$('confirmBud'); if(cb) cb.onclick=async()=>{
    try{ await saveBudget(b.category,b.amount); hideCards(); addMsg('bot','L’enveloppe '+b.category+' est posée à '+eur(b.amount)+'.') }
    catch(e){ addMsg('bot','Budget non posé.') }
  };
}
function clearAttach(){ pendingImage=null; $('attachRow').hidden=true; $('attachRow').innerHTML=''; $('receipt').value=''; $('camera').value='' }
function showAttach(url,name){
  pendingImage=url; $('attachRow').hidden=false;
  $('attachRow').innerHTML=`<img src="${url}" alt=""><span>${esc(name||'Justificatif')}</span><button type="button" id="clearAtt" aria-label="Retirer">✕</button>`;
  $('clearAtt').onclick=clearAttach;
}
function compress(file){
  return new Promise((resolve,reject)=>{
    const img=new Image(), u=URL.createObjectURL(file);
    img.onload=()=>{
      const max=1400; let w=img.width,h=img.height;
      if(w>max||h>max){const s=Math.min(max/w,max/h); w=Math.round(w*s); h=Math.round(h*s)}
      const c=document.createElement('canvas'); c.width=w; c.height=h;
      c.getContext('2d').drawImage(img,0,0,w,h); URL.revokeObjectURL(u);
      resolve(c.toDataURL('image/jpeg',0.82));
    };
    img.onerror=()=>{URL.revokeObjectURL(u); reject(new Error('Image illisible'))};
    img.src=u;
  });
}
async function attach(file){ if(!file) return; try{ showAttach(await compress(file), file.name) }catch(e){ addMsg('bot', e.message) } }
async function ask(question){
  const q=(question||$('question').value||'').trim();
  if(!q && !pendingImage) return;
  const img=pendingImage;
  addMsg('user', q||'Voici le justificatif.', img);
  const pending=addMsg('bot','Je regarde…');
  $('question').value=''; clearAttach();
  try{
    const r=await fetch(API_BASE+'/api/assistant',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:q,image:img,month})});
    const j=await r.json(); if(!r.ok) throw Error(j.detail||j.error||'Indisponible');
    pending.textContent=j.answer; showSuggestion(j.suggestion,j.budget);
  }catch(e){ pending.textContent='Je n’ai pas pu répondre. '+e.message }
}
async function reload(greet){
  try{
    const r=await fetch(API_BASE+'/api/state?month='+encodeURIComponent(month));
    const j=await r.json(); if(!r.ok) throw Error(j.detail||j.error||'Lecture impossible');
    expenses=j.expenses||[]; envelopes=j.envelopes||[];
  }catch(e){ expenses=[]; envelopes=CATS.map(c=>({category:c,budget:0,spent:0,status:'unset'})); if(greet) addMsg('bot','Je n’arrive pas à ouvrir le carnet pour l’instant.') }
  render();
  if(greet && !$('chat').children.length) addMsg('bot','Posez un ticket sur la table, ou une enveloppe. Je ne touche à rien sans votre accord.');
}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('on',x===b));
  $('talk').classList.toggle('on', b.dataset.tab==='talk');
  $('books').classList.toggle('on', b.dataset.tab==='books');
});
$('prevM').onclick=async()=>{shiftMonth(-1); await reload(false)};
$('nextM').onclick=async()=>{shiftMonth(1); await reload(false)};
document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>ask(b.dataset.q));
$('composer').addEventListener('submit',e=>{e.preventDefault(); ask()});
$('question').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault(); ask()}});
$('pickBtn').onclick=()=>$('receipt').click();
$('camBtn').onclick=()=>$('camera').click();
$('receipt').onchange=e=>attach(e.target.files[0]);
$('camera').onchange=e=>attach(e.target.files[0]);
$('composer').addEventListener('dragover',e=>e.preventDefault());
$('composer').addEventListener('drop',e=>{
  e.preventDefault();
  const f=[...e.dataTransfer.files].find(x=>x.type.startsWith('image/'));
  if(f) attach(f);
});
document.addEventListener('paste',e=>{
  const item=[...e.clipboardData.items].find(x=>x.type.startsWith('image/'));
  if(!item) return;
  const f=item.getAsFile(); if(f){ e.preventDefault(); attach(f) }
});
$('date').value=new Date().toISOString().slice(0,10);
$('form').addEventListener('submit',async e=>{
  e.preventDefault(); $('submit').disabled=true; $('error').hidden=true;
  const item={label:$('label').value,date:$('date').value,amount:$('amount').value,category:$('category').value,payer:$('payer').value,shared:true,status:'À équilibrer',note:$('note').value};
  try{
    const r=await fetch(API_BASE+'/api/expenses',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(item)});
    const j=await r.json(); if(!r.ok) throw Error(j.detail||j.error||'Erreur');
    expenses.unshift(j.expense); $('form').reset(); $('date').value=new Date().toISOString().slice(0,10); render();
  }catch(err){$('error').textContent=err.message;$('error').hidden=false}
  finally{$('submit').disabled=false}
});
reload(true);
</script>
</body>
</html>
